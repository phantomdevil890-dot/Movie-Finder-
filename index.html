<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">

    <h1 class="title">Weather App</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name...">
      <button onclick="getWeather()">Search</button>
    </div>

    <button class="location-btn" onclick="getLocationWeather()">
      📍 Use My Location
    </button>

    <div id="loading" class="loading hidden">Loading weather...</div>

    <div id="error" class="error hidden"></div>

    <div id="weatherCard" class="card hidden">
      <img id="icon" src="" alt="weather icon">

      <h2 id="city"></h2>

      <p class="temp"><span id="temp"></span>°C</p>

      <p id="condition"></p>

      <div class="details">
        <p>💧 Humidity: <span id="humidity"></span>%</p>
        <p>🌬 Wind: <span id="wind"></span> km/h</p>
      </div>
    </div>

    <footer>
      MADE BY TAMIM
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
