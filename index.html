<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>typetest. — Typing Speed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   RESET & ROOT VARIABLES
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg:           #0b0b0b;
  --surface:      #141414;
  --surface-2:    #1c1c1c;
  --border:       #222222;
  --border-hover: #333333;

  --text-primary:   #ddd8cf;
  --text-secondary: #504840;
  --text-dim:       #4a4034;

  --accent:     #c8a96e;
  --accent-low: rgba(200, 169, 110, 0.10);
  --accent-dim: #6e5830;

  --correct: #7fa878;
  --wrong:   #b55a5a;

  --font-mono:    'JetBrains Mono', 'Fira Code', monospace;
  --font-display: 'DM Serif Display', serif;

  --radius: 8px;
  --ease:   cubic-bezier(0.16, 1, 0.3, 1);
  --fast:   0.18s ease;
}

/* ============================================================
   BASE
   ============================================================ */
html { font-size: 16px; }

body {
  background-color: var(--bg);
  background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
}

.container {
  width: 100%;
  max-width: 800px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.logo {
  font-family: var(--font-display);
  font-size: 2.1rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--text-primary);
}

.dot { color: var(--accent); }

.tagline {
  margin-top: 5px;
  font-size: 0.63rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.16em;
}

.made-by {
  font-size: 0.68rem;
  color: var(--text-secondary);
  letter-spacing: 0.06em;
}

.author-name {
  font-weight: 600;
  letter-spacing: 0.04em;
  display: inline-block;
  background: linear-gradient(
    105deg,
    #8a6628 0%,
    #c8a96e 20%,
    #f0d898 45%,
    #c8a96e 65%,
    #8a6628 85%,
    #c8a96e 100%
  );
  background-size: 260% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3.8s linear infinite;
}

@keyframes shimmer {
  0%   { background-position: 0%   center; }
  100% { background-position: 260% center; }
}

/* ============================================================
   CONTROLS
   ============================================================ */
.controls {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 11px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.control-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.control-label {
  font-size: 0.62rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  white-space: nowrap;
}

.control-divider {
  width: 1px;
  height: 18px;
  background: var(--border);
  flex-shrink: 0;
}

.btn-group {
  display: flex;
  gap: 3px;
}

.ctrl-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 0.74rem;
  padding: 4px 11px;
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: color var(--fast), border-color var(--fast), background var(--fast);
}

.ctrl-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-hover);
}

.ctrl-btn.active {
  color: var(--accent);
  border-color: var(--accent-dim);
  background: var(--accent-low);
}

/* ============================================================
   STATS BAR
   ============================================================ */
.stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 10px;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 72px;
}

.stat-value {
  font-size: 1.75rem;
  font-weight: 300;
  color: var(--text-primary);
  line-height: 1;
  letter-spacing: -0.03em;
  transition: color 0.4s;
}

.stat-label {
  font-size: 0.58rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.14em;
}

.stat-center {
  display: flex;
  justify-content: center;
}

.timer-ring-wrap {
  position: relative;
  width: 78px;
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.timer-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 78px;
  height: 78px;
  transform: rotate(-90deg);
}

.ring-bg {
  fill: none;
  stroke: var(--border);
  stroke-width: 2;
}

.ring-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-dasharray: 163.4;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
}

.ring-fill.warning { stroke: #c87050; }

.timer-text {
  position: relative;
  z-index: 1;
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

/* ============================================================
   TYPING AREA
   ============================================================ */
.typing-area {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px 46px;
  cursor: text;
  transition: border-color 0.3s ease;
  overflow: hidden;
}

.typing-area.active {
  border-color: rgba(200, 169, 110, 0.16);
}

.words-wrap {
  height: calc(1.28rem * 2.3 * 3);
  overflow: hidden;
}

.words-display {
  font-size: 1.28rem;
  line-height: 2.3;
  word-spacing: 3px;
  user-select: none;
  transition: margin-top 0.22s ease;
}

.word {
  display: inline-block;
  margin-right: 10px;
  position: relative;
}

.char {
  color: var(--text-dim);
  transition: color 0.06s;
}

.char.correct { color: #7fa878; }
.char.wrong   { color: var(--wrong); }
.char.extra   { color: var(--wrong); opacity: 0.6; }

.caret {
  display: inline-block;
  width: 2px;
  height: 1.15em;
  background: var(--accent);
  border-radius: 1px;
  vertical-align: text-bottom;
  position: relative;
  top: 2px;
  margin-right: -2px;
  animation: blink 1.1s step-end infinite;
}

.caret.typing {
  animation: none;
  opacity: 1;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

.hidden-input {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: text;
  font-size: 16px;
}

.cursor-hint {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.62rem;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: lowercase;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity 0.3s;
}

.cursor-hint.hidden { opacity: 0; }

/* ============================================================
   BOTTOM BAR
   ============================================================ */
.bottom-bar {
  display: flex;
  justify-content: center;
}

.restart-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 8px 18px;
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: color var(--fast), border-color var(--fast), background var(--fast);
}

.restart-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-hover);
  background: rgba(255, 255, 255, 0.02);
}

.kbd {
  display: inline-block;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 0.6rem;
  color: var(--text-secondary);
  margin-left: 2px;
}

/* ============================================================
   RESULTS OVERLAY
   ============================================================ */
.results-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(8, 8, 8, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.results-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

.results-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 36px 44px;
  width: 100%;
  max-width: 510px;
  transform: translateY(18px) scale(0.97);
  transition: transform 0.4s var(--ease);
}

.results-overlay.visible .results-card {
  transform: translateY(0) scale(1);
}

.results-header {
  margin-bottom: 28px;
}

.results-title {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1;
}

.results-sub {
  margin-top: 5px;
  font-size: 0.63rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.14em;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 28px;
}

.result-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.result-item.highlight .result-big {
  color: var(--accent);
}

.result-big {
  font-size: 1.9rem;
  font-weight: 300;
  color: var(--text-primary);
  line-height: 1;
  letter-spacing: -0.03em;
}

.result-label {
  font-size: 0.58rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.13em;
}

.result-chart-wrap {
  border-top: 1px solid var(--border);
  padding-top: 18px;
  margin-bottom: 24px;
}

.chart-label {
  font-size: 0.58rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.13em;
  margin-bottom: 10px;
}

#wpmChart {
  width: 100%;
  height: 88px;
  display: block;
}

.results-restart-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--accent-low);
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 0.74rem;
  padding: 9px 20px;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: background var(--fast);
}

.results-restart-btn:hover {
  background: rgba(200, 169, 110, 0.18);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 580px) {
  body { padding: 28px 16px; }
  .container { gap: 20px; }
  .logo { font-size: 1.6rem; }
  .words-display { font-size: 1.08rem; }
  .words-wrap { height: calc(1.08rem * 2.3 * 3); }
  .typing-area { padding: 20px 20px 42px; }
  .results-card { padding: 26px 22px; }
  .results-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
  .result-big { font-size: 1.6rem; }
  .controls { flex-wrap: wrap; gap: 12px; }
  .control-divider { display: none; }
  .stat-value { font-size: 1.4rem; }
}
  </style>
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <h1 class="logo">typetest<span class="dot">.</span></h1>
        <p class="tagline">measure your precision</p>
      </div>
      <div class="made-by">made by <span class="author-name">Tamim</span></div>
    </header>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="control-group">
        <span class="control-label">difficulty</span>
        <div class="btn-group" id="difficultyGroup">
          <button class="ctrl-btn active" data-difficulty="easy">easy</button>
          <button class="ctrl-btn" data-difficulty="hard">hard</button>
        </div>
      </div>
      <div class="control-divider"></div>
      <div class="control-group">
        <span class="control-label">time</span>
        <div class="btn-group" id="timerGroup">
          <button class="ctrl-btn" data-time="15">15s</button>
          <button class="ctrl-btn active" data-time="30">30s</button>
          <button class="ctrl-btn" data-time="60">60s</button>
        </div>
      </div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="wpmDisplay">—</span>
        <span class="stat-label">wpm</span>
      </div>
      <div class="stat-center">
        <div class="timer-ring-wrap">
          <svg class="timer-svg" viewBox="0 0 60 60">
            <circle class="ring-bg" cx="30" cy="30" r="26" />
            <circle class="ring-fill" id="timerRing" cx="30" cy="30" r="26" />
          </svg>
          <span class="timer-text" id="timerDisplay">30</span>
        </div>
      </div>
      <div class="stat">
        <span class="stat-value" id="accDisplay">—</span>
        <span class="stat-label">accuracy</span>
      </div>
    </div>

    <!-- TYPING AREA -->
    <div class="typing-area" id="typingArea">
      <div class="words-wrap">
        <div class="words-display" id="wordsDisplay"></div>
      </div>
      <input
        type="text"
        id="inputField"
        class="hidden-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <p class="cursor-hint" id="cursorHint">click here or start typing</p>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
      <button class="restart-btn" id="restartBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 .49-4.95"></path>
        </svg>
        restart
        <span class="kbd">tab</span>
      </button>
    </div>

    <!-- RESULTS OVERLAY -->
    <div class="results-overlay" id="resultsOverlay">
      <div class="results-card">
        <div class="results-header">
          <h2 class="results-title">result<span class="dot">.</span></h2>
          <p class="results-sub">test complete</p>
        </div>
        <div class="results-grid">
          <div class="result-item highlight">
            <span class="result-big" id="resultWpm">0</span>
            <span class="result-label">wpm</span>
          </div>
          <div class="result-item">
            <span class="result-big" id="resultRaw">0</span>
            <span class="result-label">raw</span>
          </div>
          <div class="result-item">
            <span class="result-big" id="resultAcc">0%</span>
            <span class="result-label">accuracy</span>
          </div>
          <div class="result-item">
            <span class="result-big" id="resultTime">0s</span>
            <span class="result-label">time</span>
          </div>
        </div>
        <div class="result-chart-wrap">
          <p class="chart-label">wpm over time</p>
          <canvas id="wpmChart"></canvas>
        </div>
        <button class="results-restart-btn" id="resultsRestartBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 .49-4.95"></path>
          </svg>
          try again
        </button>
      </div>
    </div>

  </div>

  <script>
'use strict';

/* ============================================================
   WORD POOLS
   ============================================================ */
const WORDS = {
  easy: [
    "the","be","to","of","and","a","in","that","have","it","for","not","on",
    "with","he","as","you","do","at","this","but","his","by","from","they","we",
    "say","her","she","or","an","will","my","one","all","would","there","their",
    "what","so","up","out","if","about","who","get","which","go","me","when",
    "make","can","like","time","no","just","him","know","take","people","into",
    "year","your","good","some","could","them","see","other","than","then","now",
    "look","only","come","its","over","think","also","back","after","use","two",
    "how","our","work","first","well","way","even","new","want","because","any",
    "these","give","day","most","us","great","between","need","large","often",
    "hand","high","place","hold","turn","here","why","help","talk","again","off",
    "play","small","home","read","set","put","end","add","move","live","walk",
    "door","stop","side","car","night","light","city","paper","group","dog","tree",
    "road","bird","book","open","start","bring","show","keep","find","call","ask",
    "feel","leave","point","number","while","own","mean","try","kind","real","long",
    "last","never","next","hard","old","life","few","north","open","seem","side",
    "head","face","above","since","hot","fire","both","near","form","plan","cut"
  ],
  hard: [
    "algorithm","threshold","prerequisite","accomplish","implement","phenomenon",
    "subsequent","acknowledge","demonstrate","environment","particular","opportunity",
    "communicate","information","technology","relationship","responsibility",
    "understanding","development","organization","professional","performance",
    "considerable","representative","approximately","manufacturing","determination",
    "administration","international","configuration","infrastructure","architecture",
    "comprehensive","sophisticated","extraordinary","establishment","concentration",
    "documentation","interpretation","authentication","specification","optimization",
    "visualization","implementation","crystallization","cryptocurrency","simultaneously",
    "controversial","predominantly","consequently","differentiation","accomplishment",
    "circumstances","consciousness","discrepancy","embarrassment","exaggeration",
    "fundamental","governmental","independence","jurisdiction","knowledgeable",
    "legislation","magnificent","nevertheless","orchestration","perseverance",
    "qualification","reconnaissance","surveillance","terminology","uncomfortable",
    "vulnerability","catastrophic","deliberately","efficiently","fragmentation",
    "globalization","hierarchical","illumination","justification","overwhelming",
    "psychological","quantitative","reinforcement","substantial","transformation",
    "unprecedented","versatility","entrepreneurial","philosophical","mathematical",
    "experimental","revolutionary","interconnected","multidimensional","miscellaneous",
    "characteristics","abbreviation","accommodation","acknowledgement","bureaucratic"
  ]
};

/* ============================================================
   STATE
   ============================================================ */
let difficulty     = 'easy';
let totalTime      = 30;
let timeLeft       = 30;
let timerInterval  = null;
let sampleInterval = null;
let isRunning      = false;
let isFinished     = false;

let words          = [];
let wordEls        = [];
let wordNatOffsets = [];

let currentWordIdx  = 0;
let currentCharIdx  = 0;
let correctChars    = 0;
let totalTyped      = 0;
let wpmHistory      = [];

let caretEl      = null;
let blinkTimer   = null;

/* ============================================================
   DOM REFS
   ============================================================ */
const wordsDisplay      = document.getElementById('wordsDisplay');
const inputField        = document.getElementById('inputField');
const timerDisplay      = document.getElementById('timerDisplay');
const timerRing         = document.getElementById('timerRing');
const wpmDisplay        = document.getElementById('wpmDisplay');
const accDisplay        = document.getElementById('accDisplay');
const restartBtn        = document.getElementById('restartBtn');
const cursorHint        = document.getElementById('cursorHint');
const typingArea        = document.getElementById('typingArea');
const resultsOverlay    = document.getElementById('resultsOverlay');
const resultsRestartBtn = document.getElementById('resultsRestartBtn');

const CIRCUMFERENCE = 2 * Math.PI * 26;

/* ============================================================
   INIT
   ============================================================ */
function init() {
  clearInterval(timerInterval);
  clearInterval(sampleInterval);

  isRunning      = false;
  isFinished     = false;
  currentWordIdx = 0;
  currentCharIdx = 0;
  correctChars   = 0;
  totalTyped     = 0;
  wpmHistory     = [];
  timeLeft       = totalTime;

  timerDisplay.textContent          = totalTime;
  timerRing.style.strokeDashoffset  = '0';
  timerRing.classList.remove('warning');
  wpmDisplay.textContent            = '—';
  accDisplay.textContent            = '—';
  inputField.value                  = '';
  wordsDisplay.style.marginTop      = '0px';

  resultsOverlay.classList.remove('visible');
  typingArea.classList.remove('active');
  cursorHint.classList.remove('hidden');

  buildWords();
  renderWords();
  setTimeout(() => inputField.focus(), 60);
}

/* ============================================================
   BUILD WORDS
   ============================================================ */
function buildWords() {
  const pool = WORDS[difficulty];
  words = [];
  for (let i = 0; i < 120; i++) {
    words.push(pool[Math.floor(Math.random() * pool.length)]);
  }
}

/* ============================================================
   RENDER WORDS
   ============================================================ */
function renderWords() {
  wordsDisplay.innerHTML = '';
  wordEls = [];
  wordNatOffsets = [];

  caretEl = document.createElement('span');
  caretEl.className = 'caret';

  words.forEach(word => {
    const wordEl = document.createElement('span');
    wordEl.className = 'word';

    word.split('').forEach(ch => {
      const charEl = document.createElement('span');
      charEl.className = 'char';
      charEl.textContent = ch;
      wordEl.appendChild(charEl);
    });

    wordEls.push(wordEl);
    wordsDisplay.appendChild(wordEl);
  });

  placeCaret();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const base = wordEls[0] ? wordEls[0].offsetTop : 0;
      wordNatOffsets = wordEls.map(el => el.offsetTop - base);
    });
  });
}

/* ============================================================
   PLACE CARET
   ============================================================ */
function placeCaret() {
  const wordEl = wordEls[currentWordIdx];
  if (!wordEl) return;

  const naturalChars = wordEl.querySelectorAll('.char:not(.extra)');

  if (currentCharIdx < naturalChars.length) {
    wordEl.insertBefore(caretEl, naturalChars[currentCharIdx]);
  } else {
    wordEl.appendChild(caretEl);
  }
}

/* ============================================================
   EVENTS — FOCUS / CLICK
   ============================================================ */
typingArea.addEventListener('click', () => {
  if (!isFinished) inputField.focus();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    init();
    return;
  }
  if (!isFinished && document.activeElement !== inputField && e.key.length === 1) {
    inputField.focus();
  }
});

/* ============================================================
   EVENTS — INPUT
   ============================================================ */
inputField.addEventListener('input', () => {
  if (isFinished) return;

  const val = inputField.value;

  if (!isRunning && val.length > 0) startTest();
  if (!isRunning) return;

  cursorHint.classList.add('hidden');

  caretEl.classList.add('typing');
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(() => caretEl.classList.remove('typing'), 600);

  const currentWord = words[currentWordIdx];

  if (val.endsWith(' ')) {
    submitWord(val.trimEnd(), currentWord);
    return;
  }

  currentCharIdx = val.length;
  highlightChars(val, currentWordIdx);
  placeCaret();
  updateLiveStats();
});

inputField.addEventListener('keydown', e => {
  if (e.key === 'Backspace' && inputField.value === '') {
    e.preventDefault();
  }
});

/* ============================================================
   SUBMIT WORD
   ============================================================ */
function submitWord(typed, correctWord) {
  for (let i = 0; i < correctWord.length; i++) {
    totalTyped++;
    if (i < typed.length && typed[i] === correctWord[i]) correctChars++;
  }
  if (typed.length > correctWord.length) {
    totalTyped += typed.length - correctWord.length;
  }

  finalizeWord(typed, currentWordIdx);

  currentWordIdx++;
  currentCharIdx = 0;
  inputField.value = '';

  if (currentWordIdx < wordEls.length) {
    placeCaret();
    scrollWords();
  }

  updateLiveStats();
}

/* ============================================================
   HIGHLIGHT CHARS
   ============================================================ */
function highlightChars(typed, wi) {
  const wordEl = wordEls[wi];
  const natural = wordEl.querySelectorAll('.char:not(.extra)');

  wordEl.querySelectorAll('.char.extra').forEach(c => c.remove());

  natural.forEach((charEl, i) => {
    charEl.classList.remove('correct', 'wrong');
    if (i < typed.length) {
      charEl.classList.add(typed[i] === charEl.textContent ? 'correct' : 'wrong');
    }
  });

  if (typed.length > natural.length) {
    for (let i = natural.length; i < typed.length; i++) {
      const extra = document.createElement('span');
      extra.className = 'char extra';
      extra.textContent = typed[i];
      wordEl.appendChild(extra);
    }
  }
}

/* ============================================================
   FINALIZE WORD
   ============================================================ */
function finalizeWord(typed, wi) {
  const wordEl = wordEls[wi];

  if (caretEl.parentNode === wordEl) wordEl.removeChild(caretEl);

  wordEl.querySelectorAll('.char.extra').forEach(c => c.remove());

  const natural = wordEl.querySelectorAll('.char');
  natural.forEach((charEl, i) => {
    charEl.classList.remove('correct', 'wrong');
    if (i < typed.length) {
      charEl.classList.add(typed[i] === charEl.textContent ? 'correct' : 'wrong');
    } else {
      charEl.classList.add('wrong');
    }
  });
}

/* ============================================================
   SCROLL
   ============================================================ */
function scrollWords() {
  if (!wordNatOffsets.length) return;
  const relTop = wordNatOffsets[currentWordIdx] || 0;
  if (relTop > 0) {
    wordsDisplay.style.marginTop = `-${relTop}px`;
  }
}

/* ============================================================
   START TEST
   ============================================================ */
function startTest() {
  isRunning = true;
  typingArea.classList.add('active');
  cursorHint.classList.add('hidden');

  timerInterval = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = timeLeft;

    const offset = CIRCUMFERENCE * (1 - timeLeft / totalTime);
    timerRing.style.strokeDashoffset = offset;

    if (timeLeft <= 5) timerRing.classList.add('warning');
    if (timeLeft <= 0) finishTest();
  }, 1000);

  sampleInterval = setInterval(() => {
    const elapsed = (totalTime - timeLeft) / 60;
    const wpm = elapsed > 0 ? Math.round((correctChars / 5) / elapsed) : 0;
    wpmHistory.push(Math.max(0, wpm));
  }, 1000);
}

/* ============================================================
   LIVE STATS UPDATE
   ============================================================ */
function updateLiveStats() {
  if (!isRunning) return;
  const elapsed = (totalTime - timeLeft) / 60;
  if (elapsed > 0) {
    wpmDisplay.textContent = Math.round((correctChars / 5) / elapsed);
  }
  if (totalTyped > 0) {
    accDisplay.textContent = Math.round((correctChars / totalTyped) * 100) + '%';
  }
}

/* ============================================================
   FINISH TEST
   ============================================================ */
function finishTest() {
  clearInterval(timerInterval);
  clearInterval(sampleInterval);
  isFinished = true;
  isRunning  = false;
  inputField.blur();

  const elapsed = totalTime / 60;
  const wpm = Math.round((correctChars / 5) / elapsed);
  const raw = Math.round((totalTyped / 5) / elapsed);
  const acc = totalTyped > 0 ? Math.round((correctChars / totalTyped) * 100) : 0;

  document.getElementById('resultWpm').textContent  = wpm;
  document.getElementById('resultRaw').textContent  = raw;
  document.getElementById('resultAcc').textContent  = acc + '%';
  document.getElementById('resultTime').textContent = totalTime + 's';

  setTimeout(() => {
    resultsOverlay.classList.add('visible');
    drawChart();
  }, 380);
}

/* ============================================================
   DRAW WPM CHART
   ============================================================ */
function drawChart() {
  const canvas = document.getElementById('wpmChart');
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const data   = wpmHistory.length >= 2 ? wpmHistory : [0, 0];
  const maxVal = Math.max(...data, 20);
  const pad    = { t: 8, r: 8, b: 18, l: 28 };
  const cW     = W - pad.l - pad.r;
  const cH     = H - pad.t - pad.b;
  const n      = data.length;

  const px = i => pad.l + (i / (n - 1)) * cW;
  const py = v => pad.t + cH * (1 - v / maxVal);

  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth   = 1;
  [0, 0.5, 1].forEach(t => {
    const y = pad.t + cH * (1 - t);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(pad.l + cW, y);
    ctx.stroke();
    ctx.fillStyle  = '#404040';
    ctx.font       = `9px "JetBrains Mono", monospace`;
    ctx.textAlign  = 'right';
    ctx.fillText(Math.round(maxVal * t), pad.l - 4, y + 3.5);
  });

  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + cH);
  grad.addColorStop(0, 'rgba(200, 169, 110, 0.28)');
  grad.addColorStop(1, 'rgba(200, 169, 110, 0)');

  ctx.beginPath();
  data.forEach((v, i) => {
    i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v));
  });
  ctx.lineTo(px(n - 1), pad.t + cH);
  ctx.lineTo(px(0),     pad.t + cH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  data.forEach((v, i) => {
    i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v));
  });
  ctx.strokeStyle = '#c8a96e';
  ctx.lineWidth   = 1.8;
  ctx.lineJoin    = 'round';
  ctx.lineCap     = 'round';
  ctx.stroke();

  ctx.fillStyle = '#c8a96e';
  data.forEach((v, i) => {
    ctx.beginPath();
    ctx.arc(px(i), py(v), 2.2, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = '#404040';
  ctx.font      = `9px "JetBrains Mono", monospace`;
  ctx.textAlign = 'center';
  [0, Math.floor((n - 1) / 2), n - 1].forEach(i => {
    ctx.fillText((i + 1) + 's', px(i), H - 2);
  });
}

/* ============================================================
   CONTROLS
   ============================================================ */
document.getElementById('difficultyGroup').addEventListener('click', e => {
  const btn = e.target.closest('.ctrl-btn');
  if (!btn || btn.classList.contains('active')) return;
  document.querySelectorAll('#difficultyGroup .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  difficulty = btn.dataset.difficulty;
  init();
});

document.getElementById('timerGroup').addEventListener('click', e => {
  const btn = e.target.closest('.ctrl-btn');
  if (!btn || btn.classList.contains('active')) return;
  document.querySelectorAll('#timerGroup .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  totalTime = parseInt(btn.dataset.time);
  init();
});

restartBtn.addEventListener('click', init);
resultsRestartBtn.addEventListener('click', init);

/* ============================================================
   KICK-OFF
   ============================================================ */
init();
  </script>
